<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>candyresolver admin</title>
<style>
:root{
  --bg:#f4f5f8;--panel:#fff;--panel2:#f8f9fb;--text:#1a1d24;--muted:#6a7280;--line:#e4e7ed;
  --accent:#e0316f;--accent-soft:#fde8f0;--accent-ink:#fff;
  --ok:#14864a;--ok-bg:#e3f6ec;--warn:#a96a05;--warn-bg:#fdf1db;--err:#c4262e;--err-bg:#fde7e8;--info:#2457c5;--info-bg:#e6edfb;
  --code:#f1f3f7;--shadow:0 1px 2px rgba(20,24,40,.06),0 4px 14px rgba(20,24,40,.05);--radius:12px
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1115;--panel:#181b21;--panel2:#1d2128;--text:#e9ebf0;--muted:#8f98a8;--line:#2a2f39;
  --accent:#f2569a;--accent-soft:#3a1a2a;--accent-ink:#17080f;
  --ok:#4cc585;--ok-bg:#12301f;--warn:#e6b04c;--warn-bg:#352a10;--err:#ff7078;--err-bg:#3a1a1d;--info:#7aa2ff;--info-bg:#172544;
  --code:#12151a;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25)}}
:root[data-theme=dark]{
  --bg:#0f1115;--panel:#181b21;--panel2:#1d2128;--text:#e9ebf0;--muted:#8f98a8;--line:#2a2f39;
  --accent:#f2569a;--accent-soft:#3a1a2a;--accent-ink:#17080f;
  --ok:#4cc585;--ok-bg:#12301f;--warn:#e6b04c;--warn-bg:#352a10;--err:#ff7078;--err-bg:#3a1a1d;--info:#7aa2ff;--info-bg:#172544;
  --code:#12151a;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:16px;padding:4px 10px 16px;display:flex;gap:8px;align-items:center}
.brand b{color:var(--accent)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;width:100%}
.nav:hover{background:var(--bg);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}
#content{min-width:0}
.topbar{display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
main{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
h2.title{margin:0 0 4px;font-size:22px}.sub{margin:0 0 22px;color:var(--muted)}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:240px;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  aside.open{transform:none}
  .topbar{display:flex}
  main{padding:18px 14px 50px}
}

/* building blocks */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;line-height:1.1;margin-bottom:4px}.stat span{color:var(--muted);font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:var(--panel);border-color:var(--line);color:var(--text);font-weight:500}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:var(--panel);border-color:var(--err);color:var(--err);font-weight:500}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn.icon{padding:7px}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--panel)}
label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--code);color:var(--muted)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.err{background:var(--err-bg);color:var(--err)}.badge.info{background:var(--info-bg);color:var(--info)}
.badge.plain::before{display:none}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:.15s;flex:none;border:0;padding:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked{background:var(--accent)}.switch input:checked::after{left:18px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.bar{height:8px;background:var(--code);border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.err i{background:var(--err)}
pre.out{background:var(--code);border-radius:9px;padding:12px;overflow:auto;max-height:380px;font-size:12px;margin:10px 0 0;white-space:pre-wrap;word-break:break-word}
.keybox{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:var(--radius);padding:14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.keybox code{word-break:break-all;flex:1;min-width:240px}

/* sources split */
.split{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
@media(max-width:980px){.split{grid-template-columns:1fr}}
.srcitem{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:4px}
.srcitem:hover{background:var(--bg)}.srcitem.sel{background:var(--accent-soft);border-color:var(--accent)}
.srcitem .n{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.srcitem .m{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.srcrow{position:relative}.srcrow .srcitem{padding-right:44px}
.starbtn{position:absolute;right:8px;top:9px;background:none;border:0;cursor:pointer;color:var(--muted);padding:5px;border-radius:7px;display:inline-flex}
.starbtn:hover{background:var(--bg);color:#e6a700}.starbtn.on{color:#e6a700}.starbtn.on svg{fill:currentColor}
.star-inline{color:#e6a700;fill:currentColor;width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.vers{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip.sel{border-color:var(--accent);color:var(--accent);font-weight:700}
.editor{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code);height:430px}
.editor pre{margin:0;padding:12px 8px 12px 10px;min-width:42px;text-align:right;color:var(--muted);user-select:none;overflow:hidden;border-right:1px solid var(--line);background:var(--panel2)}
.editor pre,.editor textarea{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.editor textarea{flex:1;border:0;border-radius:0;background:transparent;padding:12px;resize:none;white-space:pre;overflow:auto;tab-size:4;outline:0!important}
.dirty{color:var(--warn);font-size:12.5px;font-weight:600}

/* tasks */
details.task{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
details.task summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details.task summary::-webkit-details-marker{display:none}
details.task[open] summary{border-bottom:1px solid var(--line)}
details.task .body{padding:12px 14px}
.run{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:6px 14px;padding:8px 0;border-bottom:1px dashed var(--line)}
.run:last-child{border:0}

/* feedback */
#toast{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.t{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:380px;box-shadow:var(--shadow);animation:in .15s}
.t.err{background:var(--err);color:#fff}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
#modal{position:fixed;inset:0;background:rgba(10,12,18,.55);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
#modal .box{background:var(--panel);border-radius:14px;padding:22px;width:420px;max-width:100%;box-shadow:var(--shadow)}
#modal h4{margin:0 0 8px;font-size:16px}#modal p{margin:0 0 18px;color:var(--muted)}
#modal .actions{justify-content:flex-end;margin:0}
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
#login .card{width:360px;max-width:100%;padding:26px}
.skeleton{height:90px;border-radius:12px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:14px}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="card">
    <div class="brand" style="padding-left:0"><span>🍬</span><span>candy<b>resolver</b></span></div>
    <label class="l" for="tok">Admin token</label>
    <input id="tok" type="password" autocomplete="current-password" placeholder="paste your admin token">
    <p id="loginErr" style="color:var(--err);min-height:20px;margin:8px 0"></p>
    <button class="btn" style="width:100%;justify-content:center" data-act="login">Sign in</button>
    <p class="hint">Printed in the server log on first start, or run <span class="mono">start.bat</span> / <span class="mono">start.sh</span> again to see it.</p>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><span>🍬</span><span>candy<b>resolver</b></span></div>
    <button class="nav" data-act="nav" data-v="overview"></button>
    <button class="nav" data-act="nav" data-v="sources"></button>
    <button class="nav" data-act="nav" data-v="keys"></button>
    <button class="nav" data-act="nav" data-v="library"></button>
    <button class="nav" data-act="nav" data-v="tasks"></button>
    <div class="spacer"></div>
    <a class="nav" href="/docs" target="_blank" style="text-decoration:none" id="docsLink"></a>
    <button class="nav" data-act="theme" id="themeBtn"></button>
    <button class="nav" data-act="logout" id="outBtn"></button>
  </aside>
  <div id="content">
    <div class="topbar"><button class="btn ghost icon" data-act="menu" id="menuBtn"></button><b>🍬 candyresolver</b></div>
    <main id="main"></main>
  </div>
</div>

<div id="toast"></div>
<div id="modal" class="hidden"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICONS = {
  overview:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
  sources:'<path d="M12 22v-5"/><path d="M9 7V2"/><path d="M15 7V2"/><path d="M6 13V8h12v5a6 6 0 0 1-12 0z"/>',
  keys:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2"/><path d="m17 6 3 3"/>',
  library:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  tasks:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  docs:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>', play:'<path d="m6 3 14 9-14 9z"/>',
  save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
  star:'<polygon points="12 2 15.1 8.6 22 9.3 17 14.1 18.2 21 12 17.7 5.8 21 7 14.1 2 9.3 8.9 8.6 12 2"/>',
  menu:'<path d="M3 6h18M3 12h18M3 18h18"/>', refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
};
const ico = n => `<svg class="i" viewBox="0 0 24 24">${ICONS[n] || ''}</svg>`;
const starIcon = () => `<svg class="i star-inline" viewBox="0 0 24 24" title="Starred">${ICONS.star}</svg>`;
const LABELS = {overview:'Overview', sources:'Sources', keys:'API keys', library:'Library', tasks:'Tasks'};

const S = {
  token: sessionStorage.getItem('cr_admin') || '', view: 'overview', timer: null,
  sources: [], selected: null, scripts: [], curVer: null, loadedCode: '', examples: null,
  newKey: null, openTasks: new Set(), srcFilter: '',
};

/* ---------- helpers ---------- */
function toast(msg, kind) {
  const d = document.createElement('div');
  d.className = 't' + (kind === 'err' ? ' err' : '');
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), kind === 'err' ? 7000 : 2600);
}
async function api(method, path, body) {
  const r = await fetch('/admin' + path, {
    method, headers: {'X-Admin-Token': S.token, 'Content-Type': 'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (r.status === 401) { signOut(); throw new Error('Invalid admin token'); }
  if (!r.ok) {
    let m = r.statusText || ('HTTP ' + r.status);
    try { const j = await r.json(); m = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) {}
    throw new Error(m);
  }
  return r.status === 204 ? null : r.json();
}
const run = async fn => { try { return await fn(); } catch (e) { toast(e.message || String(e), 'err'); } };
const bytes = n => {
  if (n == null) return '–';
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; n = Number(n);
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n >= 100 || i === 0 ? 0 : 1) + ' ' + u[i];
};
const when = s => s ? new Date(s).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'}) : '–';
const ago = s => {
  if (!s) return '–';
  const d = (Date.now() - new Date(s)) / 1000;
  if (d < 60) return 'just now'; if (d < 3600) return Math.floor(d / 60) + ' min ago';
  if (d < 86400) return Math.floor(d / 3600) + ' h ago'; return Math.floor(d / 86400) + ' d ago';
};
const BADGE = {ok:'ok', done:'ok', ready:'ok', empty:'warn', running:'info', queued:'warn', downloading:'info', pending:'warn',
  failed:'err', error:'err', expired:'', deleted:''};
const badge = (s, label) => `<span class="badge ${BADGE[s] ?? 'err'}">${esc(label || s)}</span>`;
const empty = (t, d) => `<div class="empty"><b>${esc(t)}</b>${esc(d || '')}</div>`;
const pubName = s => s.public_name || `Server ${s.id}`;
const skeleton = () => { $('#main').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>'; };

function modal({title, text, ok = 'OK', danger = false, cancel = 'Cancel'}) {
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<div class="box"><h4>${esc(title)}</h4><p>${esc(text)}</p><div class="actions">
      ${cancel ? `<button class="btn ghost" data-m="0">${esc(cancel)}</button>` : ''}
      <button class="btn" style="${danger ? 'background:var(--err);color:#fff' : ''}" data-m="1">${esc(ok)}</button></div></div>`;
    m.classList.remove('hidden');
    const done = v => { m.classList.add('hidden'); m.onclick = null; document.removeEventListener('keydown', onKey); res(v); };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey);
    m.onclick = e => { const b = e.target.closest('[data-m]'); if (b) done(b.dataset.m === '1'); else if (e.target === m) done(false); };
    $('[data-m="1"]', m).focus();
  });
}
const isDirty = () => { const c = $('#code'); return !!c && c.value !== S.loadedCode; };
async function canLeave() {
  if (!isDirty()) return true;
  return modal({title: 'Discard unsaved changes?', text: 'The script in the editor has changes that are not saved as a version.', ok: 'Discard', danger: true});
}
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('error', e => toast('Error: ' + e.message, 'err'));
window.addEventListener('unhandledrejection', e => toast(e.reason?.message || String(e.reason), 'err'));

/* ---------- shell / auth ---------- */
function paintShell() {
  $$('.nav[data-v]').forEach(b => { b.innerHTML = ico(b.dataset.v) + `<span>${LABELS[b.dataset.v]}</span>`; });
  $('#docsLink').innerHTML = ico('docs') + '<span>API docs</span>';
  $('#themeBtn').innerHTML = ico('sun') + '<span>Theme</span>';
  $('#outBtn').innerHTML = ico('out') + '<span>Sign out</span>';
  $('#menuBtn').innerHTML = ico('menu');
}
function showApp(on) {
  $('#login').classList.toggle('hidden', on);
  $('#app').classList.toggle('hidden', !on);
}
function signOut() {
  S.token = ''; sessionStorage.removeItem('cr_admin'); clearTimeout(S.timer);
  $('#tok').value = ''; showApp(false);
}
async function go(v) {
  if (!(await canLeave())) return;
  S.view = v; clearTimeout(S.timer); $('#side').classList.remove('open');
  $$('.nav[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  skeleton();
  await run(() => ({overview: viewOverview, sources: viewSources, keys: viewKeys, library: viewLibrary, tasks: viewTasks})[v]());
}
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
applyTheme(localStorage.getItem('cr_theme'));

/* ---------- overview ---------- */
async function viewOverview() {
  const [o, tasks] = await Promise.all([api('GET', '/overview'), api('GET', '/tasks?limit=50')]);
  if (S.view !== 'overview') return;
  const lib = o.library || {};
  const usedPct = o.disk_total ? Math.round((1 - o.disk_free / o.disk_total) * 100) : 0;
  const health = {};
  tasks.forEach(t => t.runs.forEach(r => {
    const h = health[r.source] ||= {name: r.source, pub: r.public_name, starred: r.starred, runs: 0, ok: 0, empty: 0, err: 0, ms: 0, last: null};
    h.runs++; h.ms += r.duration_ms || 0;
    if (r.status === 'ok') h.ok++; else if (r.status === 'empty') h.empty++; else { h.err++; h.last ||= r.error; }
  }));
  const rows = Object.values(health).sort((a, b) => b.runs - a.runs);
  $('#main').innerHTML = `
    <h2 class="title">Overview</h2><p class="sub">What's going on in your resolver right now.</p>
    <div class="grid">
      <div class="stat"><b>${o.sources_enabled}<span style="font-size:15px;font-weight:400"> / ${o.sources_total}</span></b><span>sources enabled</span></div>
      <div class="stat"><b>${o.api_keys}</b><span>API keys</span></div>
      <div class="stat"><b>${o.tasks}</b><span>tasks stored</span></div>
      <div class="stat"><b>${lib.ready || 0}</b><span>files in library · ${bytes(o.library_bytes)}</span></div>
      <div class="stat"><b>${(lib.queued || 0) + (lib.downloading || 0)}</b><span>downloads in progress</span></div>
    </div>
    <div class="card"><h3>Disk <small>${bytes(o.disk_free)} free of ${bytes(o.disk_total)}</small></h3>
      <div class="bar ${usedPct > 90 ? 'err' : usedPct > 75 ? 'warn' : ''}"><i style="width:${usedPct}%"></i></div></div>
    <div class="card"><h3>Source health <small>last ${tasks.length} tasks</small></h3>
      ${rows.length ? `<div class="tablewrap"><table><tr><th>Source</th><th>Runs</th><th>Success</th><th>Avg time</th><th>Last error</th></tr>
      ${rows.map(h => { const okp = Math.round((h.ok + h.empty) / h.runs * 100); return `<tr>
        <td><b>${h.starred ? starIcon() : ''}${esc(h.name)}</b><div class="hint" style="margin:0">shown as “${esc(h.pub || '–')}”</div></td><td>${h.runs}</td>
        <td style="min-width:140px"><div class="bar ${okp < 50 ? 'err' : okp < 90 ? 'warn' : 'ok'}"><i style="width:${okp}%"></i></div><span class="hint">${okp}% · ${h.empty} found nothing</span></td>
        <td>${Math.round(h.ms / h.runs)} ms</td><td class="mono" style="max-width:300px">${esc((h.last || '').slice(-120)) || '–'}</td></tr>`; }).join('')}
      </table></div>` : empty('No data yet', 'Run a resolve request and each source\'s results will show up here.')}</div>
    <div class="card"><h3>Recent tasks</h3>${tasks.length ? tasks.slice(0, 5).map(taskCard).join('') : empty('No tasks yet')}</div>`;
  bindTaskToggles();
}

/* ---------- sources ---------- */
const TEMPLATE = `def resolve(ctx):
    # ctx has: title, original_title, alt_titles, year, imdb_id,
    #          season, episode, episode_title, type ("movie" | "tv")
    # print() is safe: it goes to the log, not into the result.
    return {
        "streams": [
            # {"url": "https://...", "quality": "1080p", "format": "mp4", "size": 123, "headers": {}},
        ],
        "subtitles": [],   # {"lang": "en", "url": "https://...", "format": "vtt"}
        "audio": [],       # {"lang": "en"}
    }
`;
async function viewSources() {
  S.sources = await api('GET', '/sources');
  if (S.view !== 'sources') return;
  $('#main').innerHTML = `
    <h2 class="title">Sources</h2><p class="sub">Each source is a script that finds streams. Clients only ever see its <b>public name</b>. Star ★ the ones you trust: <span class="mono">wait=first_starred</span> answers with those first.</p>
    <div class="split">
      <div class="card" style="padding:12px">
        <div class="toolbar" style="margin-bottom:10px"><input type="text" id="srcSearch" placeholder="Search…" value="${esc(S.srcFilter)}" style="flex:1">
          <button class="btn icon" data-act="src-new" title="New source">${ico('plus')}</button></div>
        <div id="srcList"></div></div>
      <div id="srcDetail"></div>
    </div>`;
  renderSourceList();
  if (S.selected && S.sources.some(s => s.id === S.selected)) await showSource(S.selected);
  else $('#srcDetail').innerHTML = `<div class="card">${empty('Pick a source', 'Choose one on the left, or create a new one with +.')}</div>`;
}
function renderSourceList() {
  const q = S.srcFilter.toLowerCase();
  const list = S.sources.filter(x => !q || (x.name + ' ' + x.public_name).toLowerCase().includes(q));
  $('#srcList').innerHTML = list.map(x => `
    <div class="srcrow">
      <button class="srcitem ${x.id === S.selected ? 'sel' : ''}" data-act="src-open" data-id="${x.id}">
        <div class="n"><span>${esc(x.name)}</span>${x.enabled ? '' : '<span class="badge plain">off</span>'}</div>
        <div class="m">→ ${esc(pubName(x))} ${x.active_version ? `<span class="badge ok plain">v${x.active_version}</span>` : '<span class="badge warn plain">no script</span>'}</div>
      </button>
      <button class="starbtn ${x.starred ? 'on' : ''}" data-act="src-star" data-id="${x.id}" title="${x.starred ? 'Starred: reliable source (click to remove)' : 'Click to star as a reliable source'}">${ico('star')}</button>
    </div>`).join('') || empty(S.sources.length ? 'No match' : 'No sources yet', S.sources.length ? '' : 'Create your first one with +.');

function sourceForm(s) {

    <div><label class="l">Real name <span class="muted">(only you see this)</span></label><input type="text" id="${p}Name" value="${esc(s?.name)}" placeholder="internet-archive"></div>
    <div><label class="l">Public name <span class="muted">(shown to clients)</span></label><input type="text" id="${p}Public" value="${esc(s?.public_name)}" placeholder="Server A">
      <div class="hint">Leave empty to show “Server ${s ? s.id : 'N'}”.</div></div>
    <div><label class="l">Base URL <span class="muted">(optional, for your notes)</span></label><input type="text" id="${p}Url" value="${esc(s?.base_url)}" placeholder="https://…"></div>
    <div><label class="l">Language</label><input type="text" id="${p}Lang" value="${esc(s?.language || 'en')}"></div>

const readForm = p => ({

  language: $(`#${p}Lang`).value.trim() || 'en', timeout_s: +$(`#${p}Timeout`).value || 30, enabled: $(`#${p}Enabled`).checked, starred: $(`#${p}Starred`).checked,
});
function newSourceForm() {
  S.selected = null; renderSourceList();
  $('#srcDetail').innerHTML = `<div class="card"><h3>New source</h3>${sourceForm(null)}
    <div class="actions"><button class="btn" data-act="src-create">${ico('plus')} Create source</button></div></div>`;
  $('#nName').focus();
}
async function showSource(id) {
  const s = S.sources.find(x => x.id === id); if (!s) return;
  S.selected = id; renderSourceList();
  S.scripts = await api('GET', `/sources/${id}/scripts`);
  S.curVer = (S.scripts.find(x => x.active) || S.scripts[S.scripts.length - 1] || {}).version || null;
  $('#srcDetail').innerHTML = `
    <div class="card"><h3>Settings <small>#${s.id}</small></h3>${sourceForm(s)}
      <div class="actions"><button class="btn" data-act="src-save">${ico('save')} Save settings</button>
        <button class="btn danger" data-act="src-delete">${ico('trash')} Delete source</button></div></div>
    <div class="card"><h3>Script <small>every save is a new version; old versions are kept</small></h3>
      <div class="toolbar"><div class="vers" id="vers" style="margin:0;flex:1"></div>
        <select id="exSel" data-change="example" style="width:auto"><option value="">Load an example…</option></select></div>
      <div class="editor"><pre id="gutter">1</pre><textarea id="code" spellcheck="false" wrap="off"></textarea></div>
      <div class="toolbar" style="margin:12px 0 0">
        <input type="text" id="note" placeholder="Note (what changed?)" style="flex:1;min-width:180px">
        <label class="switch"><input type="checkbox" id="act" checked><span>Activate</span></label>
        <span class="dirty hidden" id="dirty">● unsaved</span>
        <button class="btn" data-act="ver-save" title="Ctrl+S">${ico('save')} Save as new version</button>
        <button class="btn ghost hidden" id="actBtn" data-act="ver-activate">Make v<span id="actV"></span> active</button></div></div>
    <div class="card"><h3>Test run <small>runs the selected version exactly like a real request</small></h3>
      <div class="form" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));align-items:end">
        <div><label class="l">TMDB id</label><input type="number" id="tId" placeholder="10378"></div>
        <div><label class="l">Type</label><select id="tType" data-change="ttype"><option>movie</option><option>tv</option></select></div>
        <div><label class="l">Season</label><input type="number" id="tS" disabled></div>
        <div><label class="l">Episode</label><input type="number" id="tE" disabled></div>
        <div><button class="btn" id="tBtn" data-act="test-run" style="width:100%;justify-content:center">${ico('play')} Run</button></div></div>
      <div id="tOut"></div></div>`;
  const ta = $('#code');
  ta.addEventListener('input', onEditorInput);
  ta.addEventListener('scroll', () => { $('#gutter').scrollTop = ta.scrollTop; });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const p = ta.selectionStart; ta.setRangeText('    ', p, ta.selectionEnd, 'end'); onEditorInput(); }
  });
  fillExamples();
  if (S.curVer) await loadVersion(S.curVer); else { setCode(TEMPLATE, true); renderVersions(); }
}
function setCode(code, asLoaded) {
  $('#code').value = code; if (asLoaded) S.loadedCode = code; onEditorInput();
}
function onEditorInput() {
  const ta = $('#code'); if (!ta) return;
  const n = ta.value.split('\n').length;
  $('#gutter').textContent = Array.from({length: n}, (_, i) => i + 1).join('\n');
  $('#gutter').scrollTop = ta.scrollTop;
  $('#dirty').classList.toggle('hidden', !isDirty());
}
function renderVersions() {
  $('#vers').innerHTML = S.scripts.map(v => `<button class="chip ${v.version === S.curVer ? 'sel' : ''}" data-act="ver-load" data-v="${v.version}">v${v.version}${v.active ? ' ●' : ''}</button>`).join('')
    || '<span class="muted">No versions yet. Write a script and save it.</span>';
  const cur = S.scripts.find(v => v.version === S.curVer);
  $('#actBtn').classList.toggle('hidden', !cur || cur.active);
  if (cur) $('#actV').textContent = cur.version;
}
async function loadVersion(v) {
  const sc = await api('GET', `/sources/${S.selected}/scripts/${v}`);
  S.curVer = v; setCode(sc.code, true); $('#note').value = sc.note || ''; renderVersions();
}
async function fillExamples() {
  try { if (!S.examples) S.examples = await api('GET', '/examples'); } catch (e) { S.examples = []; }
  const sel = $('#exSel'); if (!sel) return;
  sel.innerHTML = '<option value="">Load an example…</option>' + S.examples.map((x, i) => `<option value="${i}">${esc(x.name)}</option>`).join('');
}
async function refreshSourcesList() { S.sources = await api('GET', '/sources'); renderSourceList(); }

/* ---------- library ---------- */
async function viewLibrary() {
  const items = await api('GET', '/library');
  if (S.view !== 'library') return;
  $('#main').innerHTML = `
    <h2 class="title">Library</h2><p class="sub">Files downloaded to your server. They delete themselves when their time is up.</p>
    <div class="card"><div class="tablewrap"><table><tr><th>File</th><th>Provider</th><th>Quality</th><th>Status</th><th style="min-width:130px">Progress</th><th>Size</th><th>Deletes</th><th></th></tr>
    ${items.map(i => {
      const pct = i.status === 'ready' ? 100 : i.total_bytes ? Math.min(99, Math.round((i.size || 0) / i.total_bytes * 100)) : 0;
      const live = ['ready', 'queued', 'downloading'].includes(i.status);
      return `<tr><td class="mono">${esc(i.id)}<div class="hint" style="margin:0">${esc(i.task_id)}</div></td>
        <td><b>${esc(i.source)}</b><div class="hint" style="margin:0">shown as “${esc(i.public_name || '–')}”</div></td><td>${esc(i.quality || '–')}</td>
        <td>${badge(i.status)}${i.error ? `<div class="hint" style="max-width:240px;color:var(--err)">${esc(i.error)}</div>` : ''}</td>
        <td><div class="bar ${i.status === 'failed' ? 'err' : i.status === 'ready' ? 'ok' : ''}"><i style="width:${pct}%"></i></div><span class="hint">${pct}%</span></td>
        <td>${bytes(i.size)}</td><td class="muted">${i.status === 'ready' ? when(i.delete_at) : '–'}</td>
        <td style="text-align:right">${live ? `<button class="btn danger sm" data-act="lib-del" data-id="${esc(i.id)}">${ico('trash')}</button>` : ''}</td></tr>`;
    }).join('') || `<tr><td colspan="8">${empty('Nothing downloaded yet', 'Request a library download from the API and it will appear here.')}</td></tr>`}</table></div></div>`;
  if (items.some(i => ['queued', 'downloading'].includes(i.status))) S.timer = setTimeout(() => S.view === 'library' && run(viewLibrary), 3000);
}

/* ---------- tasks ---------- */
function taskCard(t) {
  const open = S.openTasks.has(t.id) ? 'open' : '';
  const ok = t.runs.filter(r => r.status === 'ok').length;
  return `<details class="task" data-id="${esc(t.id)}" ${open}><summary>
      ${badge(t.status)}<b>${esc(t.title || 'Unknown title')}</b>
      <span class="muted">${esc(t.type)}${t.season != null ? ` S${t.season}E${t.episode}` : ''} · tmdb ${t.tmdb_id}</span>
      <span class="muted" style="margin-left:auto">${ok}/${t.runs.length} sources · ${ago(t.created_at)}</span></summary>
    <div class="body"><div class="hint" style="margin:0 0 8px"><span class="mono">${esc(t.id)}</span> · created ${when(t.created_at)} · expires ${when(t.expires_at)}</div>
    ${t.runs.map(r => `<div class="run"><div><b>${r.starred ? starIcon() : ''}${esc(r.source)}</b><div class="hint" style="margin:0">shown as “${esc(r.public_name || '–')}”</div></div>
      <div>${badge(r.status)} <span class="muted">${r.streams} streams · ${r.duration_ms ?? '–'} ms</span>
      ${r.error ? `<pre class="out" style="max-height:160px;color:var(--err)">${esc(r.error)}</pre>` : ''}</div></div>`).join('') || '<span class="muted">No sources ran for this task.</span>'}</div></details>`;
}
function bindTaskToggles() {
  $$('details.task').forEach(d => d.addEventListener('toggle', () => { d.open ? S.openTasks.add(d.dataset.id) : S.openTasks.delete(d.dataset.id); }));
}
async function viewTasks() {
  const tasks = await api('GET', '/tasks?limit=100');
  if (S.view !== 'tasks') return;
  $('#main').innerHTML = `
    <h2 class="title">Tasks</h2><p class="sub">Every resolve request and what each source did with it.</p>
    <div class="toolbar"><button class="btn ghost" data-act="tasks-refresh">${ico('refresh')} Refresh</button>
      <span class="muted">${tasks.length} most recent</span></div>
    ${tasks.map(taskCard).join('') || `<div class="card">${empty('No tasks yet', 'They appear here when your website calls /v1/resolve.')}</div>`}`;
  bindTaskToggles();
  if (tasks.some(t => ['pending', 'running'].includes(t.status))) S.timer = setTimeout(() => S.view === 'tasks' && run(viewTasks), 2000);
}

/* ---------- actions ---------- */
const actions = {
  async login() {
    S.token = $('#tok').value.trim(); $('#loginErr').textContent = '';
    try { await api('GET', '/overview'); } catch (e) { $('#loginErr').textContent = e.message; return; }
    sessionStorage.setItem('cr_admin', S.token); showApp(true); go('overview');
  },
  logout() { signOut(); },
  menu() { $('#side').classList.toggle('open'); },
  theme() {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark'; localStorage.setItem('cr_theme', next); applyTheme(next);
  },
  nav(el) { go(el.dataset.v); },
  copy(el) { navigator.clipboard.writeText(el.dataset.text).then(() => toast('Copied'), () => toast('Copy failed - select and copy manually', 'err')); },

  async 'src-open'(el) { if (!(await canLeave())) return; await showSource(+el.dataset.id); },
  async 'src-new'() { if (await canLeave()) newSourceForm(); },
  async 'src-create'() {
    const s = await api('POST', '/sources', readForm('n')); toast('Source created');
    await refreshSourcesList(); await showSource(s.id);
  },
  async 'src-star'(el) {
    const id = +el.dataset.id, now = !S.sources.find(x => x.id === id).starred;
    await api('PATCH', `/sources/${id}`, {starred: now});
    await refreshSourcesList();
    if (S.selected === id && $('#gStarred')) $('#gStarred').checked = now;
    toast(now ? 'Starred: marked as a reliable source' : 'Star removed');
  },
  async 'src-save'() {
    await api('PATCH', `/sources/${S.selected}`, readForm('g')); toast('Settings saved'); await refreshSourcesList();
  },
  async 'src-delete'() {
    const s = S.sources.find(x => x.id === S.selected);
    if (!(await modal({title: `Delete “${s.name}”?`, text: 'The source and all its script versions will be removed. Past tasks keep their history.', ok: 'Delete', danger: true}))) return;
    await api('DELETE', `/sources/${S.selected}`); S.selected = null; S.loadedCode = ''; toast('Source deleted'); viewSources();
  },
  async 'ver-load'(el) { if (await canLeave()) await loadVersion(+el.dataset.v); },
  async 'ver-save'() {
    const code = $('#code').value;
    const r = await api('POST', `/sources/${S.selected}/scripts`, {code, note: $('#note').value, activate: $('#act').checked});
    toast(`Saved as v${r.version}` + (r.active ? ' and activated' : ''));
    S.scripts = await api('GET', `/sources/${S.selected}/scripts`); S.curVer = r.version; S.loadedCode = code;
    renderVersions(); onEditorInput(); refreshSourcesList();
  },
  async 'ver-activate'() {
    await api('POST', `/sources/${S.selected}/scripts/${S.curVer}/activate`); toast(`v${S.curVer} is now active`);
    S.scripts = await api('GET', `/sources/${S.selected}/scripts`); renderVersions(); refreshSourcesList();
  },
  async 'test-run'() {
    const body = {tmdb_id: +$('#tId').value, type: $('#tType').value, version: S.curVer || undefined,
      season: $('#tS').value === '' ? null : +$('#tS').value, episode: $('#tE').value === '' ? null : +$('#tE').value};
    if (!body.tmdb_id) { toast('Enter a TMDB id first', 'err'); return; }
    if (isDirty()) toast('Testing the saved version, not the unsaved editor text', 'err');
    const btn = $('#tBtn'); btn.disabled = true; $('#tOut').innerHTML = '<p class="muted">Running…</p>';
    try {
      const r = await api('POST', `/sources/${S.selected}/test`, body);
      const streams = r.ok ? (r.result.streams || []) : [];
      $('#tOut').innerHTML = `<div class="toolbar" style="margin:14px 0 8px">${r.ok ? badge('ok') : '<span class="badge err">error</span>'}
        <span class="muted">v${r.version} · ${r.duration_ms} ms${r.ok ? ` · ${streams.length} streams · ${(r.result.subtitles || []).length} subtitles` : ''}</span></div>
        ${streams.length ? `<div class="tablewrap"><table><tr><th>Quality</th><th>Format</th><th>Size</th><th>URL</th></tr>${streams.slice(0, 30).map(s => `<tr>
          <td>${esc(s.quality || '–')}</td><td>${esc(s.format || '–')}</td><td>${bytes(s.size)}</td>
          <td class="mono" style="max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.url)}</td></tr>`).join('')}</table></div>` : ''}
        <details style="margin-top:10px"><summary class="muted" style="cursor:pointer">${r.ok ? 'Raw result' : 'Error details'}</summary>
          <pre class="out">${esc(r.ok ? JSON.stringify(r.result, null, 2) : r.error)}</pre></details>
        <details style="margin-top:6px"><summary class="muted" style="cursor:pointer">Context sent to the script</summary><pre class="out">${esc(JSON.stringify(r.context, null, 2))}</pre></details>`;
    } finally { btn.disabled = false; }
  },

  async 'key-create'() {
    const name = $('#kName').value.trim(); if (!name) { toast('Give the key a name', 'err'); return; }
    S.newKey = await api('POST', '/api-keys', {name, rate_limit_per_min: +$('#kRate').value || 60}); viewKeys();
  },
  async 'key-toggle'(el) { await api('PATCH', `/api-keys/${el.dataset.id}`, {enabled: el.dataset.en === '1'}); viewKeys(); },
  async 'lib-del'(el) {
    if (!(await modal({title: 'Delete this file?', text: 'It is removed from the server now (or the download is cancelled).', ok: 'Delete', danger: true}))) return;
    await api('DELETE', `/library/${el.dataset.id}`); toast('Deleted'); viewLibrary();
  },
  'tasks-refresh'() { return viewTasks(); },
};
const changes = {
  example(el) {
    if (el.value === '') return; const ex = S.examples[+el.value]; el.value = '';
    return (async () => {
      if ($('#code').value.trim() && $('#code').value !== S.loadedCode &&
          !(await modal({title: 'Replace editor content?', text: 'Nothing is saved until you click “Save as new version”.', ok: 'Replace'}))) return;
      setCode(ex.code, false); $('#note').value = 'from example: ' + ex.name;
    })();
  },
  ttype(el) { const tv = el.value === 'tv'; $('#tS').disabled = $('#tE').disabled = !tv; if (!tv) { $('#tS').value = $('#tE').value = ''; } },
  rate(el) { return api('PATCH', `/api-keys/${el.dataset.id}`, {rate_limit_per_min: +el.value}).then(() => toast('Rate limit saved')); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !actions[el.dataset.act]) return;
  run(() => actions[el.dataset.act](el, e));
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (el && changes[el.dataset.change]) run(() => changes[el.dataset.change](el));
});
document.addEventListener('input', e => {
  if (e.target.id === 'srcSearch') { S.srcFilter = e.target.value; renderSourceList(); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && $('#code')) { e.preventDefault(); run(() => actions['ver-save']()); }
  if (e.key === 'Enter' && e.target.id === 'tok') run(() => actions.login());
});

/* ---------- start ---------- */
paintShell();
(async () => {
  if (S.token) {
    try { await api('GET', '/overview'); showApp(true); go('overview'); return; } catch (e) {}
  }
  showApp(false);
})();
</script>
</body>
</html>
