<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>candyresolver admin</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#6b7480;--line:#e2e5ea;--accent:#d6336c;--accent2:#fff;--ok:#1a8f4c;--warn:#b7791f;--err:#c92a2a;--code:#f1f3f5}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--text:#e8eaed;--muted:#8d96a3;--line:#2b303a;--accent:#f06595;--accent2:#14161a;--ok:#4cc27f;--warn:#e0b04a;--err:#ff6b6b;--code:#15181d}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;color:var(--accent)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font:inherit}
nav button.on{background:var(--bg);color:var(--text);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
button.btn{background:var(--accent);color:var(--accent2);border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600}
button.btn.ghost{background:none;color:var(--text);border:1px solid var(--line);font-weight:500}
button.btn.danger{background:none;color:var(--err);border:1px solid var(--err)}
button.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.row>div{display:flex;flex-direction:column}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:var(--code);color:var(--muted);margin-right:4px}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.err,.tag.off{color:var(--err)}
.split{display:grid;grid-template-columns:280px 1fr;gap:16px}
@media(max-width:800px){.split{grid-template-columns:1fr}}
.item{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--bg)}.item.sel{background:var(--bg);border-color:var(--accent)}
textarea.code{width:100%;min-height:340px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;tab-size:4;white-space:pre;resize:vertical}
pre.out{background:var(--code);border-radius:8px;padding:12px;overflow:auto;max-height:420px;font-size:12px;margin:10px 0 0}
.ver{display:inline-block;margin:0 6px 6px 0;padding:3px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:12px}
.ver.sel{border-color:var(--accent);color:var(--accent);font-weight:600}
.bar{height:6px;background:var(--code);border-radius:99px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--accent)}
#toast{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:30}
#toast div{background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;max-width:360px;box-shadow:0 4px 14px #0004}
#toast div.err{background:var(--err);color:#fff}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20}
#login .card{width:340px}
.keybox{background:var(--code);border:1px dashed var(--accent);border-radius:8px;padding:10px;margin-bottom:12px;word-break:break-all}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;color:var(--accent)">candyresolver</h2>
    <label for="tok">Admin token</label>
    <input id="tok" type="password" style="width:100%" autocomplete="current-password" placeholder="paste your admin token">
    <p id="loginErr" class="muted" style="color:var(--err);min-height:18px"></p>
    <button class="btn" style="width:100%" onclick="login()">Sign in</button>
  </div>
</div>

<header class="hidden" id="top">
  <h1>🍬 candyresolver</h1>
  <nav id="nav">
    <button data-v="overview">Overview</button>
    <button data-v="sources">Sources</button>
    <button data-v="keys">API keys</button>
    <button data-v="library">Library</button>
    <button data-v="tasks">Tasks</button>
  </nav>
  <button class="btn ghost" onclick="logout()">Sign out</button>
</header>

<main id="main" class="hidden"></main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = sessionStorage.getItem('cr_admin') || '';
let view = 'overview', timer = null;

function toast(msg, err) {
  const d = document.createElement('div');
  if (err) d.className = 'err';
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), err ? 6000 : 2500);
}

async function api(method, path, body) {
  const r = await fetch('/admin' + path, {
    method,
    headers: {'X-Admin-Token': token, 'Content-Type': 'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (r.status === 401) { logout(); throw new Error('Invalid admin token'); }
  if (!r.ok) {
    let m = r.statusText;
    try { const j = await r.json(); m = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) {}
    throw new Error(m);
  }
  return r.status === 204 ? null : r.json();
}
const guard = fn => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message, true); } };

const bytes = n => {
  if (n == null) return '-';
  const u = ['B','KB','MB','GB','TB']; let i = 0; n = Number(n);
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n >= 100 || i === 0 ? 0 : 1) + ' ' + u[i];
};
const when = s => s ? new Date(s).toLocaleString() : '-';
const statusTag = s => {
  const c = {ok:'ok', done:'ok', ready:'ok', empty:'warn', running:'warn', queued:'warn', downloading:'warn', pending:'warn'}[s] || 'err';
  return `<span class="tag ${c}">${esc(s)}</span>`;
};

/* ---------- auth / nav ---------- */
function showApp(on) {
  $('#login').classList.toggle('hidden', on);
  $('#top').classList.toggle('hidden', !on);
  $('#main').classList.toggle('hidden', !on);
}
async function login() {
  token = $('#tok').value.trim();
  $('#loginErr').textContent = '';
  try {
    await api('GET', '/overview');
    sessionStorage.setItem('cr_admin', token);
    showApp(true); go('overview');
  } catch (e) { $('#loginErr').textContent = e.message; }
}
function logout() {
  token = ''; sessionStorage.removeItem('cr_admin'); clearInterval(timer);
  $('#tok').value = ''; showApp(false);
}
$('#tok').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#nav').addEventListener('click', e => { if (e.target.dataset.v) go(e.target.dataset.v); });

function go(v) {
  view = v; clearInterval(timer);
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  ({overview: viewOverview, sources: viewSources, keys: viewKeys, library: viewLibrary, tasks: viewTasks})[v]();
}

/* ---------- overview ---------- */
const viewOverview = guard(async () => {
  const o = await api('GET', '/overview');
  const lib = o.library || {};
  const used = o.disk_total ? Math.round((1 - o.disk_free / o.disk_total) * 100) : 0;
  $('#main').innerHTML = `
    <div class="grid">
      <div class="stat"><b>${o.sources_enabled}/${o.sources_total}</b><span>sources enabled</span></div>
      <div class="stat"><b>${o.api_keys}</b><span>API keys</span></div>
      <div class="stat"><b>${o.tasks}</b><span>tasks stored</span></div>
      <div class="stat"><b>${lib.ready || 0}</b><span>library files ready (${bytes(o.library_bytes)})</span></div>
      <div class="stat"><b>${(lib.queued || 0) + (lib.downloading || 0)}</b><span>downloading / queued</span></div>
      <div class="stat"><b>${bytes(o.disk_free)}</b><span>disk free (${used}% of ${bytes(o.disk_total)} used)</span></div>
    </div>
    <p class="muted" style="margin-top:16px">API docs: <a href="/docs" target="_blank" style="color:var(--accent)">/docs</a></p>`;
});

/* ---------- sources ---------- */
let sources = [], selected = null, scripts = [], curVer = null;
const TEMPLATE = `def resolve(ctx):
    # ctx has: title, original_title, alt_titles, year, imdb_id,
    #          season, episode, episode_title, type ("movie" | "tv")
    # print() is safe (goes to the log, not the result).
    return {
        "streams": [
            # {"url": "https://...", "quality": "1080p", "format": "mp4", "size": 123, "headers": {}},
        ],
        "subtitles": [],   # {"lang": "en", "url": "https://...", "format": "vtt"}
        "audio": [],       # {"lang": "en"}
    }
`;

const viewSources = guard(async () => {
  $('#main').innerHTML = `
    <div class="split">
      <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px">
        <b>Sources</b><button class="btn" onclick="newSourceForm()">+ New</button></div>
        <div id="srcList"></div></div>
      <div id="srcDetail"><div class="card muted">Pick a source on the left, or create a new one.</div></div>
    </div>`;
  await loadSources();
  if (selected && sources.some(s => s.id === selected)) openSource(selected);
});

async function loadSources() { sources = await api('GET', '/sources'); renderSourceList(); }
function renderSourceList() {
  $('#srcList').innerHTML = sources.map(s => `
    <div class="item ${s.id === selected ? 'sel' : ''}" onclick="openSource(${s.id})">
      <b>${esc(s.name)}</b> <span class="muted">${esc(s.language)}</span><br>
      ${s.enabled ? '' : '<span class="tag off">disabled</span>'}
      ${s.active_version ? `<span class="tag ok">v${s.active_version} active</span>` : '<span class="tag warn">no script</span>'}
    </div>`).join('') || '<p class="muted">No sources yet.</p>';
}

function newSourceForm() {
  selected = null; renderSourceList();
  $('#srcDetail').innerHTML = `<div class="card"><b>New source</b><div class="row" style="margin-top:10px">
    <div><label>Name</label><input id="nName" placeholder="internet-archive"></div>
    <div><label>Base URL (optional)</label><input id="nUrl" placeholder="https://..."></div>
    <div><label>Language</label><input id="nLang" value="en" size="5"></div>
    <div><label>Timeout (s)</label><input id="nTo" type="number" value="30" min="1" max="300" style="width:80px"></div>
    <button class="btn" onclick="createSource()">Create</button></div></div>`;
}
const createSource = guard(async () => {
  const s = await api('POST', '/sources', {name: $('#nName').value.trim(), base_url: $('#nUrl').value.trim(),
    language: $('#nLang').value.trim() || 'en', timeout_s: +$('#nTo').value || 30});
  toast('Source created'); await loadSources(); openSource(s.id);
});

const openSource = guard(async id => {
  selected = id; renderSourceList();
  const s = sources.find(x => x.id === id);
  scripts = await api('GET', `/sources/${id}/scripts`);
  curVer = (scripts.find(x => x.active) || scripts[scripts.length - 1] || {}).version || null;
  $('#srcDetail').innerHTML = `
    <div class="card">
      <div class="row">
        <div><label>Name</label><input id="eName" value="${esc(s.name)}"></div>
        <div><label>Base URL</label><input id="eUrl" value="${esc(s.base_url)}"></div>
        <div><label>Language</label><input id="eLang" value="${esc(s.language)}" size="5"></div>
        <div><label>Timeout (s)</label><input id="eTo" type="number" value="${s.timeout_s}" min="1" max="300" style="width:80px"></div>
        <div><label>Enabled</label><select id="eEn"><option value="1" ${s.enabled ? 'selected' : ''}>yes</option><option value="0" ${s.enabled ? '' : 'selected'}>no</option></select></div>
        <button class="btn" onclick="saveSource(${id})">Save</button>
        <button class="btn danger" onclick="deleteSource(${id})">Delete</button>
      </div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:0">
        <div style="display:block"><b>Script</b> <span class="muted">— each save creates a new version; old versions are kept</span></div>
        <select id="exSel" onchange="loadExample(this.value)"><option value="">Load an example…</option></select>
      </div>
      <div id="vers" style="margin:10px 0"></div>
      <textarea id="code" class="code" spellcheck="false" placeholder="def resolve(ctx): ..."></textarea>
      <div class="row" style="margin-top:10px">
        <div style="flex:1"><label>Note (optional)</label><input id="note" style="width:100%" placeholder="what changed?"></div>
        <div><label>&nbsp;</label><span><input type="checkbox" id="act" checked> activate</span></div>
        <button class="btn" onclick="saveVersion(${id})">Save as new version</button>
        <button class="btn ghost" id="actBtn" onclick="activateVersion(${id})">Activate this version</button>
      </div>
    </div>
    <div class="card">
      <b>Test run</b> <span class="muted">— runs the selected version now, exactly like a real request</span>
      <div class="row" style="margin-top:10px">
        <div><label>TMDB id</label><input id="tId" type="number" placeholder="10378" style="width:110px"></div>
        <div><label>Type</label><select id="tType"><option>movie</option><option>tv</option></select></div>
        <div><label>Season</label><input id="tS" type="number" style="width:70px"></div>
        <div><label>Episode</label><input id="tE" type="number" style="width:70px"></div>
        <button class="btn" id="tBtn" onclick="runTest(${id})">Run</button>
      </div>
      <div id="tOut"></div>
    </div>`;
  $('#code').addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const t = e.target, p = t.selectionStart;
      t.value = t.value.slice(0, p) + '    ' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = p + 4; }
  });
  renderVersions();
  fillExamples();
  if (curVer) await loadVersion(curVer); else { $('#code').value = TEMPLATE; $('#actBtn').classList.add('hidden'); }
});

let examples = null;
async function fillExamples() {
  try { if (!examples) examples = await api('GET', '/examples'); } catch (e) { examples = []; }
  const sel = $('#exSel'); if (!sel) return;
  sel.innerHTML = '<option value="">Load an example…</option>' +
    examples.map((x, i) => `<option value="${i}">${esc(x.name)}</option>`).join('');
}
function loadExample(i) {
  if (i === '') return;
  if ($('#code').value.trim() && !confirm('Replace the editor content with this example? (Nothing is saved until you click "Save as new version".)')) { $('#exSel').value = ''; return; }
  $('#code').value = examples[+i].code; $('#note').value = 'from example: ' + examples[+i].name; $('#exSel').value = '';
}

function renderVersions() {
  $('#vers').innerHTML = scripts.map(v => `<span class="ver ${v.version === curVer ? 'sel' : ''}" onclick="loadVersion(${v.version})">v${v.version}${v.active ? ' ●' : ''}</span>`).join('')
    || '<span class="muted">No versions yet — write a script below and save it.</span>';
}
const loadVersion = guard(async v => {
  const sc = await api('GET', `/sources/${selected}/scripts/${v}`);
  curVer = v; $('#code').value = sc.code; $('#note').value = sc.note || '';
  $('#actBtn').classList.toggle('hidden', sc.active);
  renderVersions();
});
const saveSource = guard(async id => {
  await api('PATCH', `/sources/${id}`, {name: $('#eName').value.trim(), base_url: $('#eUrl').value.trim(),
    language: $('#eLang').value.trim(), timeout_s: +$('#eTo').value || 30, enabled: $('#eEn').value === '1'});
  toast('Saved'); await loadSources();
});
const deleteSource = guard(async id => {
  if (!confirm('Delete this source and ALL its script versions?')) return;
  await api('DELETE', `/sources/${id}`); selected = null; toast('Deleted');
  await loadSources(); $('#srcDetail').innerHTML = '<div class="card muted">Source deleted.</div>';
});
const saveVersion = guard(async id => {
  const r = await api('POST', `/sources/${id}/scripts`, {code: $('#code').value, note: $('#note').value, activate: $('#act').checked});
  toast(`Saved as v${r.version}` + (r.active ? ' (active)' : ''));
  await loadSources(); await openSource(id);
});
const activateVersion = guard(async id => {
  await api('POST', `/sources/${id}/scripts/${curVer}/activate`); toast(`v${curVer} is now active`);
  await loadSources(); await openSource(id);
});
const runTest = guard(async id => {
  const body = {tmdb_id: +$('#tId').value, type: $('#tType').value, version: curVer || undefined,
    season: $('#tS').value === '' ? null : +$('#tS').value, episode: $('#tE').value === '' ? null : +$('#tE').value};
  if (!body.tmdb_id) { toast('Enter a TMDB id', true); return; }
  $('#tBtn').disabled = true; $('#tOut').innerHTML = '<p class="muted">Running…</p>';
  try {
    const r = await api('POST', `/sources/${id}/test`, body);
    $('#tOut').innerHTML = `<p>${r.ok ? '<span class="tag ok">ok</span>' : '<span class="tag err">error</span>'}
      <span class="muted">v${r.version} · ${r.duration_ms} ms${r.ok ? ` · ${(r.result.streams || []).length} streams` : ''}</span></p>
      <pre class="out">${esc(r.ok ? JSON.stringify(r.result, null, 2) : r.error)}</pre>
      <details><summary class="muted">context sent to the script</summary><pre class="out">${esc(JSON.stringify(r.context, null, 2))}</pre></details>`;
  } finally { $('#tBtn').disabled = false; }
});

/* ---------- api keys ---------- */
let newKey = null;
const viewKeys = guard(async () => {
  const keys = await api('GET', '/api-keys');
  $('#main').innerHTML = `
    ${newKey ? `<div class="keybox"><b>New key for “${esc(newKey.name)}” — copy it now, it is shown only once:</b><br>
      <span class="mono">${esc(newKey.key)}</span> <button class="btn ghost" onclick="copyKey()">Copy</button></div>` : ''}
    <div class="card"><b>Create API key</b><div class="row" style="margin-top:10px">
      <div><label>Name</label><input id="kName" placeholder="my-movie-site"></div>
      <div><label>Rate limit / min</label><input id="kRate" type="number" value="60" min="1" style="width:110px"></div>
      <button class="btn" onclick="createKey()">Create</button></div></div>
    <div class="card"><table><tr><th>Name</th><th>Key</th><th>Rate/min</th><th>Last used</th><th>Status</th><th></th></tr>
    ${keys.map(k => `<tr><td>${esc(k.name)}</td><td class="mono">${esc(k.prefix)}…</td>
      <td><input type="number" value="${k.rate_limit_per_min}" min="1" style="width:80px" onchange="setRate(${k.id}, this.value)"></td>
      <td class="muted">${when(k.last_used_at)}</td>
      <td>${k.enabled ? '<span class="tag ok">enabled</span>' : '<span class="tag off">disabled</span>'}</td>
      <td><button class="btn ghost" onclick="toggleKey(${k.id}, ${!k.enabled})">${k.enabled ? 'Disable' : 'Enable'}</button></td></tr>`).join('')
      || '<tr><td colspan="6" class="muted">No keys yet.</td></tr>'}</table></div>`;
});
const createKey = guard(async () => {
  const name = $('#kName').value.trim(); if (!name) { toast('Give the key a name', true); return; }
  newKey = await api('POST', '/api-keys', {name, rate_limit_per_min: +$('#kRate').value || 60}); viewKeys();
});
const toggleKey = guard(async (id, en) => { await api('PATCH', `/api-keys/${id}`, {enabled: en}); viewKeys(); });
const setRate = guard(async (id, v) => { await api('PATCH', `/api-keys/${id}`, {rate_limit_per_min: +v}); toast('Saved'); });
function copyKey() { navigator.clipboard.writeText(newKey.key).then(() => toast('Copied')); }

/* ---------- library ---------- */
const viewLibrary = guard(async () => {
  const items = await api('GET', '/library');
  if (view !== 'library') return;
  $('#main').innerHTML = `<div class="card"><table>
    <tr><th>ID</th><th>Source</th><th>Quality</th><th>Status</th><th>Progress</th><th>Size</th><th>Deletes at</th><th></th></tr>
    ${items.map(i => {
      const pct = i.total_bytes ? Math.min(100, Math.round((i.size || 0) / i.total_bytes * 100)) : (i.status === 'ready' ? 100 : 0);
      return `<tr><td class="mono">${esc(i.id)}</td><td>${esc(i.source)}</td><td>${esc(i.quality || '-')}</td>
      <td>${statusTag(i.status)}${i.error ? `<div class="muted" style="max-width:240px">${esc(i.error)}</div>` : ''}</td>
      <td><div class="bar"><i style="width:${pct}%"></i></div></td><td>${bytes(i.size)}</td>
      <td class="muted">${i.status === 'ready' ? when(i.delete_at) : '-'}</td>
      <td>${['ready', 'queued', 'downloading'].includes(i.status) ? `<button class="btn danger" onclick="delItem('${esc(i.id)}')">Delete</button>` : ''}</td></tr>`;
    }).join('') || '<tr><td colspan="8" class="muted">Nothing downloaded yet.</td></tr>'}</table></div>`;
  if (items.some(i => ['queued', 'downloading'].includes(i.status))) timer = setTimeout(() => view === 'library' && viewLibrary(), 3000);
});
const delItem = guard(async id => {
  if (!confirm('Delete this file from the server?')) return;
  await api('DELETE', `/library/${id}`); toast('Deleted'); viewLibrary();
});

/* ---------- tasks ---------- */
const viewTasks = guard(async () => {
  const tasks = await api('GET', '/tasks');
  $('#main').innerHTML = `<div class="card"><table>
    <tr><th>Task</th><th>Title</th><th>Status</th><th>Sources</th><th>Created</th></tr>
    ${tasks.map(t => `<tr><td class="mono">${esc(t.id)}</td>
      <td>${esc(t.title || '?')}<div class="muted">${esc(t.type)} · tmdb ${t.tmdb_id}${t.season != null ? ` · S${t.season}E${t.episode}` : ''}</div></td>
      <td>${statusTag(t.status)}</td>
      <td>${t.runs.map(r => `<div>${statusTag(r.status)} ${esc(r.source)} <span class="muted">${r.streams} streams · ${r.duration_ms ?? '-'} ms</span>${r.error ? `<div class="muted mono" style="max-width:460px;white-space:pre-wrap;color:var(--err)">${esc(r.error.slice(-300))}</div>` : ''}</div>`).join('') || '<span class="muted">no sources ran</span>'}</td>
      <td class="muted">${when(t.created_at)}</td></tr>`).join('')
      || '<tr><td colspan="5" class="muted">No tasks yet.</td></tr>'}</table></div>`;
});

/* ---------- start ---------- */
(async () => {
  if (token) {
    try { await api('GET', '/overview'); showApp(true); go('overview'); return; } catch (e) {}
  }
  showApp(false);
})();
</script>
</body>
</html>
